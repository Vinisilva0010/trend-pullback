[package]
name = "tp-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = "0.13.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "fs"] }
tp-core = { version = "0.1.0", path = "../tp-core" }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
